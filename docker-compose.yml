services:
  college_report_postgres:
    image: postgres:18
    container_name: college_report_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - college_report_postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  college_report_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: college_report_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    volumes:
      - college_report_pgadmin_data:/var/lib/pgadmin

    ports:
      - "5050:80"

    depends_on:
      college_report_postgres:
        condition: service_healthy

volumes:
  college_report_postgres_data:
    name: college_report_postgres_data

  college_report_pgadmin_data:
    name: college_report_pgadmin_data
